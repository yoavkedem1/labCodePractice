[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-perception-workshop"
version = "1.0.0"
description = "Synthetic visual motion discrimination: a research programming workshop"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.1.3", "pandas==2.2.3", "matplotlib==3.9.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "nbclient==0.10.2", "nbformat==5.10.4", "ipykernel==6.29.5", "jupyterlab==4.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
